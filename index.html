<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glass Shop – WhatsApp Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --glass: rgba(255,255,255,0.15);
  --border: rgba(255,255,255,0.3);
  --accent: #25d366;
  --text: #fff;
}
*{box-sizing:border-box;font-family:Segoe UI,Tahoma,sans-serif}
body{
  margin:0;min-height:100vh;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:var(--text);
  padding:30px;
}
.container{
  max-width:1200px;margin:auto;
  display:grid;grid-template-columns:2fr 1fr;gap:25px;
}
.glass{
  background:var(--glass);
  backdrop-filter:blur(15px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
}
.products{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px;
}
.product img{
  width:100%;height:150px;object-fit:cover;border-radius:15px;
}
.price{color:#00d4ff;font-weight:bold}
.qty{
  display:flex;justify-content:center;gap:10px;margin:10px 0;
}
.qty button{
  width:30px;height:30px;border-radius:50%;
  border:none;cursor:pointer;font-weight:bold;
}
.buy-btn,.submit-btn{
  width:100%;padding:10px;border:none;border-radius:25px;
  background:linear-gradient(135deg,#25d366,#128c7e);
  color:#fff;font-weight:bold;cursor:pointer;
}
.cart-item{
  display:flex;justify-content:space-between;margin-bottom:6px;
}
.remove{cursor:pointer;color:#ff6b6b}
input,textarea{
  width:100%;padding:10px;margin-bottom:10px;
  border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,0.2);color:#fff;
}
@media(max-width:900px){.container{grid-template-columns:1fr}}
</style>
</head>

<body>

<div class="container">

<!-- PRODUCTS -->
<div class="glass">
<h2>🛍 Products</h2>
<div class="products">

<div class="product glass">
  <img src="https://picsum.photos/300?1">
  <h3>Product One</h3>
  <div class="price">$19.99</div>
  <div class="qty">
    <button class="minus">−</button>
    <span class="qty-value">1</span>
    <button class="plus">+</button>
  </div>
  <button class="buy-btn">Add to Cart</button>
</div>

<div class="product glass">
  <img src="https://picsum.photos/300?2">
  <h3>Product Two</h3>
  <div class="price">$29.99</div>
  <div class="qty">
    <button class="minus">−</button>
    <span class="qty-value">1</span>
    <button class="plus">+</button>
  </div>
  <button class="buy-btn">Add to Cart</button>
</div>

<div class="product glass">
  <img src="https://picsum.photos/300?3">
  <h3>Product Three</h3>
  <div class="price">$39.99</div>
  <div class="qty">
    <button class="minus">−</button>
    <span class="qty-value">1</span>
    <button class="plus">+</button>
  </div>
  <button class="buy-btn">Add to Cart</button>
</div>

</div>
</div>

<!-- CART + FORM -->
<div class="glass">
<h2>🧾 Cart</h2>
<div id="cart"></div>
<strong>Total: <span id="total">$0.00</span></strong>

<hr style="opacity:.3;margin:15px 0">

<h2>👤 Buyer Info</h2>
<form id="orderForm">
  <input type="text" placeholder="Full Name" required>
  <input type="tel" placeholder="Phone" required>
  <textarea placeholder="Address" required></textarea>
  <button class="submit-btn">Order via WhatsApp</button>
</form>
</div>

</div>

<script>
const whatsappNumber="213661234567"; // CHANGE THIS
let cart=[];

function updateCart(){
  const cartDiv=document.getElementById("cart");
  const totalEl=document.getElementById("total");
  cartDiv.innerHTML="";
  let total=0;

  cart.forEach((p,i)=>{
    const sum=p.price*p.qty;
    total+=sum;
    cartDiv.innerHTML+=`
      <div class="cart-item">
        <span>${p.name} × ${p.qty}</span>
        <span>$${sum.toFixed(2)} <span class="remove" onclick="removeItem(${i})">✖</span></span>
      </div>`;
  });
  totalEl.textContent="$"+total.toFixed(2);
}

function removeItem(i){
  cart.splice(i,1);
  updateCart();
}

document.querySelectorAll(".product").forEach(prod=>{
  let qty=1;
  const qEl=prod.querySelector(".qty-value");

  prod.querySelector(".plus").onclick=()=>{qty++;qEl.textContent=qty;}
  prod.querySelector(".minus").onclick=()=>{if(qty>1)qty--;qEl.textContent=qty;}

  prod.querySelector(".buy-btn").onclick=()=>{
    const name=prod.querySelector("h3").textContent;
    const price=parseFloat(prod.querySelector(".price").textContent.replace("$",""));
    const exist=cart.find(p=>p.name===name);
    if(exist) exist.qty+=qty;
    else cart.push({name,price,qty});
    qty=1;qEl.textContent=1;
    updateCart();
  };
});

document.getElementById("orderForm").onsubmit=e=>{
  e.preventDefault();
  if(cart.length===0){alert("Cart empty");return;}

  const name=e.target[0].value;
  const phone=e.target[1].value;
  const address=e.target[2].value;

  let msg="🛒 *New Order*\\n\\n";
  let total=0;
  cart.forEach(p=>{
    const s=p.price*p.qty;
    total+=s;
    msg+=`• ${p.name} × ${p.qty} = $${s.toFixed(2)}\\n`;
  });
  msg+=`\\n💰 Total: $${total.toFixed(2)}\\n`;
  msg+=`\\n👤 ${name}\\n📞 ${phone}\\n📍 ${address}`;

  window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`,"_blank");
};
</script>

</body>
</html>
