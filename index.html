<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Glassmorphism Shop</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.3);
      --accent: #00d4ff;
      --text: #ffffff;
    }

    * { box-sizing: border-box; font-family: "Segoe UI", Tahoma, sans-serif; }

    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: var(--text);
      display: flex; justify-content: center; align-items: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px; width: 100%;
      display: grid; grid-template-columns: 2fr 1fr; gap: 30px;
    }

    h1, h2 { margin-top: 0; }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }

    .products {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;
    }

    .product img {
      width: 100%; height: 160px; object-fit: cover; border-radius: 15px;
    }

    .price { color: var(--accent); font-weight: bold; }

    .qty {
      display: flex; justify-content: center; gap: 10px; margin: 10px 0;
    }

    .qty button {
      width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
    }

    .cart-item {
      display: flex; justify-content: space-between; margin-bottom: 6px;
    }

    .remove { cursor: pointer; color: #ff6b6b; }

    select, input, textarea {
      width: 100%; padding: 10px; border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.2); color: white;
    }

    .submit-btn {
      width: 100%; padding: 12px; margin-top: 10px;
      border-radius: 25px; border: none; cursor: pointer;
      background: linear-gradient(135deg,#25d366,#128c7e);
      color: white; font-size: 1rem;
    }

    .success { display:none; text-align:center; font-size:1.2rem; }

    @media(max-width:900px){ .container{ grid-template-columns:1fr;} }
  </style>
</head>
<body>

  <div class="container">

    <!-- Products section -->
    <div class="glass">
      <h1>🛒 Our Products</h1>
      <div class="products">

        <div class="product glass">
          <img src="https://picsum.photos/400/300?1" alt="Product 1">
          <h3>Product One</h3>
          <div class="price">$19.99</div>
          <button class="buy-btn">Buy</button>
        </div>

        <div class="product glass">
          <img src="https://picsum.photos/400/300?2" alt="Product 2">
          <h3>Product Two</h3>
          <div class="price">$24.99</div>
          <button class="buy-btn">Buy</button>
        </div>

        <div class="product glass">
          <img src="https://picsum.photos/400/300?3" alt="Product 3">
          <h3>Product Three</h3>
          <div class="price">$29.99</div>
          <button class="buy-btn">Buy</button>
        </div>

        <div class="product glass">
          <img src="https://picsum.photos/400/300?4" alt="Product 4">
          <h3>Product Four</h3>
          <div class="price">$34.99</div>
          <button class="buy-btn">Buy</button>
        </div>

        <div class="product glass">
          <img src="https://picsum.photos/400/300?5" alt="Product 5">
          <h3>Product Five</h3>
          <div class="price">$39.99</div>
          <button class="buy-btn">Buy</button>
        </div>

      </div>
    </div>

    <!-- Buyer form -->
    <div class="glass">
      <h2>🧾 Cart</h2>
      <div id="cartSummary" style="margin-bottom:10px;"></div>
      <strong>Total: <span id="totalPrice">$0.00</span></strong>
      <hr style="opacity:0.3;margin:15px 0;">

      <h2>👤 Buyer Information</h2>
      <form>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="John Doe" required />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="john@email.com" required />
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input type="tel" placeholder="+213..." required />
        </div>

        <div class="form-group">
          <label>Address</label>
          <textarea placeholder="Your delivery address" required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Order via WhatsApp</button>
      </form>
    </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="john@email.com" required />
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input type="tel" placeholder="+1 234 567 890" />
        </div>

        <div class="form-group">
          <label>Address</label>
          <textarea placeholder="Your delivery address"></textarea>
        </div>

        <button type="submit" class="submit-btn">Confirm Order</button>
      </form>
    </div>

  </div>

  <script>
    const whatsappNumber = "213000000000"; // replace with your WhatsApp number (international format)
    let cart = [];

    function updateCartSummary() {
      const summary = document.getElementById('cartSummary');
      const totalEl = document.getElementById('totalPrice');
      let total = 0;

      summary.innerHTML = '';
      cart.forEach((item, index) => {
        total += item.price;
        summary.innerHTML += `<div>• ${item.name} - $${item.price.toFixed(2)}</div>`;
      });

      totalEl.innerText = `$${total.toFixed(2)}`;
    }

    document.querySelectorAll('.buy-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        const product = e.target.closest('.product');
        const name = product.querySelector('h3').innerText;
        const price = parseFloat(product.querySelector('.price').innerText.replace('$', ''));

        cart.push({ name, price });
        updateCartSummary();
        alert(`${name} added to cart`);
      });
    });

    document.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault();

      if (cart.length === 0) {
        alert('Your cart is empty.');
        return;
      }

      const name = this.querySelector('input[type="text"]').value;
      const email = this.querySelector('input[type="email"]').value;
      const phone = this.querySelector('input[type="tel"]').value;
      const address = this.querySelector('textarea').value;

      let message = `🛒 *New Order*

`;
      let total = 0;

      cart.forEach((item) => {
        message += `• ${item.name} - $${item.price.toFixed(2)}
`;
        total += item.price;
      });

      message += `
💰 *Total:* $${total.toFixed(2)}

`;
      message += `👤 Name: ${name}
`;
      message += `📧 Email: ${email}
`;
      message += `📞 Phone: ${phone}
`;
      message += `📍 Address: ${address}`;

      const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    });
  </script>
</body>
</html>
